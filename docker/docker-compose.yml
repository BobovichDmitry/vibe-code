# =============================================================================
# Dev docker-compose для локальной разработки.
# Два сервиса: frontend (Nuxt SSR, 3000) + backend (Nest API, 3001).
# Nuxt проксирует /api/** → backend:3001 (nitro routeRules).
# =============================================================================

services:
  frontend:
    build:
      context: ../
      dockerfile: docker/Dockerfile.frontend
    ports:
      - "3000:3000"
    environment:
      # В dev-контейнере backend доступен по имени сервиса 'backend'.
      NUXT_API_BASE: http://backend:3001/api
      NUXT_PUBLIC_API_BASE: /api
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: ../
      dockerfile: docker/Dockerfile.backend
    ports:
      - "3001:3001"
    env_file:
      - ./env
    environment:
      # Nuxt-origin (dev) для CORS клиентского fetch.
      CORS_ORIGIN: http://localhost:3000
    restart: unless-stopped

  # PostgreSQL (use when DB_TYPE=postgres)
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: app_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pg_data: