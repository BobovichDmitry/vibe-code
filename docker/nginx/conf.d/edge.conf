# =============================================================================
# Конфиг edge-nginx: VibeSetup UI (прод, 0downtime).
#
# Единственный сервис, торчащий в reverse-proxy (VIRTUAL_HOST). Проксирует
# ВЕСЬ трафик на активный frontend-слот (blue/green); сам слот — пара
# frontend (Nitro SSR) + backend (Nest), Nitro проксирует /api/** своему
# backend'у внутри слота.
#
# Адрес активного слота (upstream app_frontend) определяется runtime-файлом
# docker/nginx/runtime/upstream-frontend.conf — его переключает скрипт
# деплоя docker/deploy_0downtime.sh (nginx -s reload, без разрыва соединений).
# =============================================================================

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

include /etc/nginx/runtime/upstream-frontend.conf;

server {
    listen 80;
    server_name _;

    client_max_body_size 1000M;

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_http_version 1.1;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 60s;
        send_timeout 3600s;

        proxy_pass http://app_frontend;
    }
}
