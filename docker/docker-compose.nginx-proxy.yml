version: '3.8'

services:
  app:
    image: ${APP_IMAGE:-registry.example.com/your-group/your-project:latest}
    # NO ports — nginx-proxy connects via Docker network
    env_file:
      - ./.env
    environment:
      # === nginx-proxy (set DOMAIN, EMAIL before starting) ===
      - VIRTUAL_HOST=${DOMAIN}
      - LETSENCRYPT_HOST=${DOMAIN}
      - LETSENCRYPT_EMAIL=${EMAIL}
      - DB_HOST=postgres
      - DB_PASSWORD=${PG_ROOT_PASSWORD}
      - DB_TYPE=postgres
    # nginx-proxy network
    networks:
      - reverse-proxy
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_PASSWORD=${PG_ROOT_PASSWORD}
      - POSTGRES_DB=app_db
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - reverse-proxy
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pg_data:

networks:
  reverse-proxy:
    external: true
