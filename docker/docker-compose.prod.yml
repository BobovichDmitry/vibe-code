# =============================================================================
# Production docker-compose (ansible-деплой + CI-деплой из Registry).
#
# Два режима:\n#   1) ansible (deploy.sh): FRONTEND_IMAGE/BACKEND_IMAGE не заданы →
#      docker compose build собирает образы и тегирует их значениями image:
#      (по умолчанию «<имя>:local»), затем up -d.
#   2) GitLab CI: образы уже собраны и запушены в Registry; CI передаёт
#      FRONTEND_IMAGE/BACKEND_IMAGE (тег по SHA) и делает pull + up -d.
#
# Три сервиса:
#   frontend (Nuxt SSR, 3000) — edge, за nginx-proxy (VIRTUAL_HOST + Let's Encrypt);
#   backend  (Nest API, 3001)  — внутренний, БЕЗ VIRTUAL_HOST (внешний трафик
#                               идёт только на frontend; Nuxt проксирует /api/**);
#   postgres                  — без проброса 5432 наружу.
#
# frontend зависит от backend; Nuxt проксирует /api/** → http://backend:3001
# (nitro routeRules, цель из NUXT_API_BASE).
# =============================================================================

services:
  frontend:
    # CI: frontend-образ из Registry (см. .gitlab-ci.yml);
    # ansible/build без переменных — локальный тег из compose build.
    image: ${FRONTEND_IMAGE:-app-frontend:local}
    build:
      context: ../
      dockerfile: docker/Dockerfile.frontend
    env_file:
      - ./env
    environment:
      # nginx-proxy маршрутизация + Let's Encrypt (только frontend — edge).
      VIRTUAL_HOST: ${VIRTUAL_HOST}
      LETSENCRYPT_HOST: ${LETSENCRYPT_HOST}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL}
      # SSR-фетч к backend (имя сервиса = 'backend', внутренняя сеть).
      NUXT_API_BASE: http://backend:3001/api
      # Клиентский base — относительный /api (браузер → свой origin → Nitro прокси).
      NUXT_PUBLIC_API_BASE: /api
    networks:
      - default
      - reverse-proxy
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

  backend:
    image: ${BACKEND_IMAGE:-app-backend:local}
    build:
      context: ../
      dockerfile: docker/Dockerfile.backend
    # НЕТ VIRTUAL_HOST — backend внутренний, наружу не торчит.
    # НЕТ проброса порта — только внутренняя сеть.
    env_file:
      - ./env
    environment:
      # CORS = домен (за nginx-proxy) для клиентского fetch.
      CORS_ORIGIN: ${CORS_ORIGIN}
      # Cookie-auth: secure в проде (HTTPS за nginx-proxy).
      COOKIE_SECURE: "true"
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    # НЕТ проброса 5432 — только внутренняя сеть.
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME}']
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pg_data:

networks:
  default:
    driver: bridge
  reverse-proxy:
    external: true