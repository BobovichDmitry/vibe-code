# =============================================================================
# Production docker-compose (ansible-деплой + CI-деплой из Registry).
#
# Схема 0downtime (blue-green):
#
#   nginx-proxy (общий, внешний)
#     └── edge-nginx (VIRTUAL_HOST; runtime-swappable upstream)
#           ├── frontend-blue ← backend-blue    (сеть slot_blue)
#           └── frontend-green ← backend-green   (сеть slot_green)
#   postgres — общий для обоих слотов.
#
# Слот = пара frontend (Nitro SSR, 3000) + backend (Nest API, 3001).
# Внутри своей сети каждый backend/frontend имеет alias 'backend'/'frontend' —
# Nitro проксирует /api/** → http://backend:3001/api (NUXT_API_BASE), т.е.
# слот переключается целиком, не завися от цвета другого слота.
#
# Переключает слоты скрипт docker/deploy_0downtime.sh: он переписывает
# nginx/runtime/upstream-frontend.conf и делает `nginx -s reload` в edge-nginx.
#
# Два режима образов:
#   1) ansible (deploy.sh): FRONTEND_IMAGE/BACKEND_IMAGE не заданы →
#      скрипт деплоя собирает образы на сервере (`--build`).
#   2) GitLab CI: образы уже собраны в Registry; скрипт деплоя делает pull
#      (`--pull`, FRONTEND_IMAGE/BACKEND_IMAGE переданы через docker/.env).
# =============================================================================

services:

  # ===========================================================================
  # Edge: nginx между nginx-proxy и слотами. Единственный сервис в reverse-proxy.
  # ===========================================================================
  edge-nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./nginx/conf.d/edge.conf:/etc/nginx/conf.d/default.conf:ro
      # runtime-файл: скрипт деплоя переписывает его на сервере и делает
      # `nginx -s reload` — переключение слота без разрыва соединений.
      - ./nginx/runtime/upstream-frontend.conf:/etc/nginx/runtime/upstream-frontend.conf:ro
    expose:
      - 80
    environment:
      # nginx-proxy маршрутизация + Let's Encrypt.
      VIRTUAL_HOST: ${VIRTUAL_HOST}
      LETSENCRYPT_HOST: ${LETSENCRYPT_HOST}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL}
    networks:
      - slot_blue
      - slot_green
      - reverse-proxy

  # ===========================================================================
  # Blue-green слоты: описание сервисов одно (якоря x-frontend/x-backend),
  # различаются только сетью и суффиксом имени.
  # ===========================================================================
  frontend-blue:
    &frontend-common
    image: ${FRONTEND_IMAGE:-app-frontend:local}
    build:
      context: ../
      dockerfile: docker/Dockerfile.frontend
    restart: unless-stopped
    env_file:
      - ./env
    environment:
      # SSR-фетч к backend СВОЕГО слота: alias 'backend' в сети слота.
      NUXT_API_BASE: http://backend:3001/api
      NUXT_PUBLIC_API_BASE: /api
    expose:
      - 3000
    # 127.0.0.1 (НЕ localhost): в alpine localhost может резолвиться в ::1,
    # а Nitro/node слушают только IPv4 — healthcheck вечно unhealthy.
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/ || exit 1
      timeout: 5s
      interval: 5s
      retries: 30
    networks:
      slot_blue:
        aliases:
          - frontend

  backend-blue:
    &backend-common
    image: ${BACKEND_IMAGE:-app-backend:local}
    build:
      context: ../
      dockerfile: docker/Dockerfile.backend
    restart: unless-stopped
    env_file:
      - ./env
    environment:
      # Cookie-auth: secure в проде (HTTPS за nginx-proxy).
      COOKIE_SECURE: "true"
    expose:
      - 3001
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://127.0.0.1:3001/api/health || exit 1
      timeout: 5s
      interval: 5s
      retries: 30
    networks:
      slot_blue:
        aliases:
          - backend

  frontend-green:
    <<: *frontend-common
    networks:
      slot_green:
        aliases:
          - frontend

  backend-green:
    <<: *backend-common
    networks:
      slot_green:
        aliases:
          - backend

  # ===========================================================================
  # Общие зависимости (общие для обоих слотов)
  # ===========================================================================
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    # НЕТ проброса 5432 — только внутренние сети слотов.
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      # -d обязателен: без него pg_isready стучится в БД с именем юзера
      # (которой нет — есть ${DB_DATABASE}) и засоряет логи FATAL'ами каждые 5с.
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}']
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - slot_blue
      - slot_green

volumes:
  pg_data:

networks:
  slot_blue:
    driver: bridge
  slot_green:
    driver: bridge
  reverse-proxy:
    external: true
