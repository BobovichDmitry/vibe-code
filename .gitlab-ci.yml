# =============================================================================
# GitLab CI — сборка образов (frontend Nuxt + backend Nest) в Registry и
# CI-деплой по SSH (pull образов из Registry + docker compose up) на целевой
# сервер.
#
# Архитектура: два отдельных сервиса (см. agents.md):
#   frontend — Nuxt SSR (Dockerfile.frontend, порт 3000, edge за nginx-proxy);
#   backend  (Nest API)  (Dockerfile.backend, порт 3001, внутренний без VIRTUAL_HOST).
# Деплой: docker-compose.prod.yml (frontend + backend + postgres).
#
# Этап deploy НЕ собирает ничего на сервере: джоба получает ключ
# расшифровки (SOPS_AGE_KEY_TEST / SOPS_AGE_KEY_PRODUCTION) из CI/CD
# Variables, экспортирует SOPS_AGE_KEY и DEPLOY_ENV, после чего запускает
# docker/deploy_ci.sh, который:
#   — расшифровывает .envs/<env>/secret.enc.yaml (sops+age, ключи в git),
#     мержит с .envs/<env>/public.yaml и экспортирует как env;
#   — ставит на сервере всё с нуля (ansible → docker → nginx-proxy);
#   — пуллит собранные образы с ВРЕМЕННЫМ токеном (CI_JOB_TOKEN);
#   — поднимает docker-compose.prod.yml и прогоняет healthcheck.
#
# Требуемые CI/CD variables (Settings → CI/CD → Variables, protected+masked;
# по ОДНОЙ age-ключу на окружение — содержимое приватного ключа, вторая строка
# файла .agekey; сама пара генерируется через age-keygen, см. docs/deployment.md):
#   SOPS_AGE_KEY_TEST        — age-ключ стенда test;
#   SOPS_AGE_KEY_PRODUCTION  — age-ключ стенда production.
#
# Секреты окружений (пароли, base64 SSH-ключа деплоя) хранятся ЗАШИФРОВАННЫМИ
# в git: .envs/<env>/secret.enc.yaml (цикл encrypt/decrypt — scripts/encrypt.sh,
# scripts/decrypt.sh).
#
# Ветка master (default) → build → авто-деплой в test И production.
# Если age-ключ не задан — деплой-джоба ПРОПУСКАЕТСЯ
# (warning в консоли, пайплайн зелёный, ошибок нет).
#
# Опциональные CI/CD variables:
#   DEPLOY_SKIP_HOST_KEY_CHECK=1 — отключает проверку host key сервера при SSH
#       (для пересозданных серверов, когда в known_hosts раннера остался старый
#       ключ; НЕБЕЗОПАСНО — MITM-риск; альтернатива — ssh-keygen -R <host> на раннере).
# =============================================================================

stages:
  - build
  - deploy

variables:
  DOCKER_TLS_CERTDIR: ""
  DOCKER_DRIVER: overlay2
  # --- Теги образов (GitLab расширяет их на момент запуска джобы) ---
  # :<commit-sha> — иммутабельная версия конкретного коммита (деплой строго по ней)
  # :<branch>     — движущийся тег текущей ветки (для отладки/ручного pull)
  IMAGE_TAG_SHA: "$CI_COMMIT_SHORT_SHA"
  IMAGE_TAG_BRANCH: "$CI_COMMIT_REF_SLUG"
  FRONTEND_IMAGE_SHA: "$CI_REGISTRY_IMAGE/frontend:${CI_COMMIT_SHORT_SHA}"
  FRONTEND_IMAGE_BRANCH: "$CI_REGISTRY_IMAGE/frontend:${CI_COMMIT_REF_SLUG}"
  BACKEND_IMAGE_SHA: "$CI_REGISTRY_IMAGE/backend:${CI_COMMIT_SHORT_SHA}"
  BACKEND_IMAGE_BRANCH: "$CI_REGISTRY_IMAGE/backend:${CI_COMMIT_REF_SLUG}"

# =============================================
# Build — собирает и пушит ОБА образа в Registry
# =============================================

build:docker:
  stage: build
  image: docker:27-cli
  services:
    - name: docker:27-dind
      alias: docker
      command: ["--tls=false"]
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    # Контекст — корень репо: Dockerfile'ы сами копируют нужные workspace-папки
    # (monorepo: package.json + apps/* нужны обоим сборкам).
    # Каждый образ пушится с ДВУМЯ тегами: хеш текущего коммита (иммутабельный,
    # именно его пуллит deploy:*) и имя текущей ветки (движущийся тег).
    - 'echo "→ Сборка образов с тегами: sha=$IMAGE_TAG_SHA branch=$IMAGE_TAG_BRANCH"'
    - docker build --pull -f docker/Dockerfile.frontend -t "$FRONTEND_IMAGE_SHA" -t "$FRONTEND_IMAGE_BRANCH" .
    - docker build --pull -f docker/Dockerfile.backend -t "$BACKEND_IMAGE_SHA" -t "$BACKEND_IMAGE_BRANCH" .
    - docker push "$FRONTEND_IMAGE_SHA"
    - docker push "$FRONTEND_IMAGE_BRANCH"
    - docker push "$BACKEND_IMAGE_SHA"
    - docker push "$BACKEND_IMAGE_BRANCH"
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

# =============================================
# CI-образ для деплой-джоб (ubuntu + sops/yq/ssh внутри).
# sops/yq скачиваются с GitHub ЗДЕСЬ, а не в runtime деплой-джобы:
# DNS к GitHub на раннере периодически флапает — деплои падали.
# Пересборка: вручную или при изменении docker/Dockerfile.ci-deploy.
# =============================================
build:ci-image:
  stage: build
  image: docker:27-cli
  services:
    - name: docker:27-dind
      alias: docker
      command: ["--tls=false"]
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - docker build --pull -f docker/Dockerfile.ci-deploy -t "$CI_REGISTRY_IMAGE/ci-deploy:latest" .
    - docker push "$CI_REGISTRY_IMAGE/ci-deploy:latest"
  rules:
    # Автопересборка при изменении рецепта образа...
    - changes:
        - docker/Dockerfile.ci-deploy
    # ...и всегда доступна вручную (кнопка Run pipeline).
    - when: manual
    # manual не должен останавливать пайплайн, если не запущен
  allow_failure: true

# =============================================
# Deploy — CI-деплой из Registry (без сборки на сервере)
# =============================================
# Джоба передаёт SOPS_AGE_KEY_<ENV> и DEPLOY_ENV в docker/deploy_ci.sh:
# он расшифровывает энвы окружения (.envs/<env>/), ставит ansible/docker/
# nginx-proxy на пустом сервере, пуллит образы с временным токеном
# (CI_JOB_TOKEN) и поднимает compose.
# ВНИМАНИЕ: age-ключи задаются в Settings → CI/CD → Variables
# (protected + masked) — НЕ хардкодим их здесь.

.base_deploy_ci:
  image: $CI_REGISTRY_IMAGE/ci-deploy:latest
  # ^ sops/yq/ssh внутри (docker/Dockerfile.ci-deploy): без сетевых загрузок
  #   в runtime джобы (DNS к GitHub периодически флапает).
  variables:
    # Нужны ansible/ и docker/ из репо (архив исходников для сервера).
    # Образы для деплоя пиннятся тегом $CI_COMMIT_SHORT_SHA — запускается
    # именно та версия, которая собрана из текущего коммита.
    GIT_STRATEGY: fetch

deploy:test:
  extends: .base_deploy_ci
  stage: deploy
  environment:
    name: test
  resource_group: deploy-test
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    # Развиваем test-стенд и из develop (не только из default-ветки)
    - if: $CI_COMMIT_BRANCH == "develop"
  script:
    # Age-ключ не задан → деплой ПРОПУСКАЕТСЯ (джоба зелёная), а не падает.
    - |
      if [ -z "${SOPS_AGE_KEY_TEST:-}" ]; then
        echo "⚠  SOPS_AGE_KEY_TEST не задан — деплой в окружение 'test' ПРОПУЩЕН."
        echo "   Чтобы включить: Settings → CI/CD → Variables → SOPS_AGE_KEY_TEST (protected+masked)."
        exit 0
      fi
      export SOPS_AGE_KEY="$SOPS_AGE_KEY_TEST"
      export DEPLOY_ENV=test
      # Деплой строго по тегу = хеш текущего коммита (не latest, не ветка):
      # распаковывается ровно та сборка, которую сделал build:docker этого коммита.
      export FRONTEND_IMAGE="$FRONTEND_IMAGE_SHA"
      export BACKEND_IMAGE="$BACKEND_IMAGE_SHA"
      bash docker/deploy_ci.sh

deploy:production:
  extends: .base_deploy_ci
  stage: deploy
  environment:
    name: production
  resource_group: deploy-production
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - |
      if [ -z "${SOPS_AGE_KEY_PRODUCTION:-}" ]; then
        echo "⚠ SOPS_AGE_KEY_PRODUCTION не задан — деплой в окружение 'production' ПРОПУЩЕН."
        echo "   Заведи переменную в Settings → CI/CD → Variables (protected+masked):"
        echo "   SOPS_AGE_KEY_PRODUCTION = содержимое приватного age-ключа прод-стенда"
        exit 0
      fi
      export SOPS_AGE_KEY="$SOPS_AGE_KEY_PRODUCTION"
      export DEPLOY_ENV=production
      # Деплой строго по тегу = хеш текущего коммита (не latest, не ветка):
      # распаковывается ровно та сборка, которую сделал build:docker этого коммита.
      export FRONTEND_IMAGE="$FRONTEND_IMAGE_SHA"
      export BACKEND_IMAGE="$BACKEND_IMAGE_SHA"
      bash docker/deploy_ci.sh
