stages:
  - build
  - deploy

variables:
  DOCKER_TLS_CERTDIR: ""
  DOCKER_DRIVER: overlay2
  IMAGE_TAG_SHA: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
  IMAGE_TAG_REF: "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG"
  IMAGE_TAG_LATEST: "$CI_REGISTRY_IMAGE:latest"

# =============================================
# Build — собирает и пушит образ в Registry
# =============================================

build:docker-image:
  stage: build
  image: docker:27-cli
  services:
    - name: docker:27-dind
      alias: docker
      command: ["--tls=false"]
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - docker build --pull -f docker/Dockerfile -t "$IMAGE_TAG_SHA" -t "$IMAGE_TAG_REF" .
    - docker push "$IMAGE_TAG_SHA"
    - docker push "$IMAGE_TAG_REF"
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        docker tag "$IMAGE_TAG_SHA" "$IMAGE_TAG_LATEST"
        docker push "$IMAGE_TAG_LATEST"
      fi
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

# =============================================
# Deploy — SSH-подключение, pull образа и up compose
# =============================================

.base_deploy:
  image: obvu/ssh_deployer
  before_script:
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - head -3 ~/.ssh/id_rsa
    - tail -3 ~/.ssh/id_rsa
  after_script:
    - rm -f ~/.ssh/id_rsa
  variables:
    GIT_STRATEGY: none
    APP_IMAGE: "$IMAGE_TAG_SHA"
  script:
    - ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa "$DEPLOY_HOST" "cd $DEPLOY_PATH/docker && APP_IMAGE=$APP_IMAGE docker compose -f docker-compose.nginx-proxy.yml pull app && APP_IMAGE=$APP_IMAGE docker compose -f docker-compose.nginx-proxy.yml up -d"

deploy:main:
  extends: .base_deploy
  stage: deploy
  variables:
    DEPLOY_HOST: ubuntu@ai.wormsoft.ru
    DEPLOY_PATH: /home/ubuntu/projects/inside/vibe-setup-ui
    APP_IMAGE: "$IMAGE_TAG_LATEST"
  environment:
    name: production
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
