# =============================================================================
# GitLab CI — сборка образов (frontend Nuxt + backend Nest) в Registry и
# деплой по SSH (pull + docker compose up) на prod-сервер.
#
# Архитектура: два отдельных сервиса (см. agents.md):
#   frontend — Nuxt SSR (Dockerfile.frontend, порт 3000, edge за nginx-proxy);
#   backend  (Nest API)  (Dockerfile.backend, порт 3001, внутренний без VIRTUAL_HOST).
# Деплой: docker-compose.prod.yml (frontend + backend + postgres).
#
# Требуемые CI/CD variables (Settings → CI/CD → Variables, можно на группе):
#   SSH_PRIVATE_KEY — приватный ключ (type: File или Variable) для SSH на сервер;
#   DEPLOY_HOST     — ssh-цель вида user@host (или alias из ~/.ssh/config);
#   DEPLOY_PATH     — путь к проекту на сервере (внутри — подпапка docker/ с
#                     docker-compose.prod.yml, env и .env для compose);
#   DEPLOY_COMPOSE_PROJECT (опционально) — имя compose-проекта (-p; дефолт —
#                     $CI_PROJECT_NAME; должно совпадать с тем, под каким
#                     проект уже поднят на сервере, чтобы обновлялись те же
#                     контейнеры, а не создавались новые).
# =============================================================================

stages:
  - build
  - deploy

variables:
  DOCKER_TLS_CERTDIR: ""
  DOCKER_DRIVER: overlay2
  # Реестр-образы: два сервиса (split Dockerfile, монолита больше нет).
  FRONTEND_IMAGE_SHA: "$CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHORT_SHA"
  FRONTEND_IMAGE_REF: "$CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_REF_SLUG"
  FRONTEND_IMAGE_LATEST: "$CI_REGISTRY_IMAGE/frontend:latest"
  BACKEND_IMAGE_SHA: "$CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHORT_SHA"
  BACKEND_IMAGE_REF: "$CI_REGISTRY_IMAGE/backend:$CI_COMMIT_REF_SLUG"
  BACKEND_IMAGE_LATEST: "$CI_REGISTRY_IMAGE/backend:latest"

# =============================================
# Build — собирает и пушит ОБА образа в Registry
# =============================================

build:docker:
  stage: build
  image: docker:27-cli
  services:
    - name: docker:27-dind
      alias: docker
      command: ["--tls=false"]
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    # Контекст — корень репо: Dockerfile'ы сами копируют нужные workspace-папки
    # (monorepo: package.json + apps/* нужны обоим сборкам).
    - docker build --pull -f docker/Dockerfile.frontend -t "$FRONTEND_IMAGE_SHA" -t "$FRONTEND_IMAGE_REF" .
    - docker build --pull -f docker/Dockerfile.backend -t "$BACKEND_IMAGE_SHA" -t "$BACKEND_IMAGE_REF" .
    - docker push "$FRONTEND_IMAGE_SHA"
    - docker push "$FRONTEND_IMAGE_REF"
    - docker push "$BACKEND_IMAGE_SHA"
    - docker push "$BACKEND_IMAGE_REF"
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        docker tag "$FRONTEND_IMAGE_SHA" "$FRONTEND_IMAGE_LATEST"
        docker push "$FRONTEND_IMAGE_LATEST"
        docker tag "$BACKEND_IMAGE_SHA" "$BACKEND_IMAGE_LATEST"
        docker push "$BACKEND_IMAGE_LATEST"
      fi
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

# =============================================
# Deploy — SSH на сервер: pull образов и up compose
# =============================================
# Внимание: деплой-переменные (DEPLOY_HOST, DEPLOY_PATH, DEPLOY_COMPOSE_PROJECT,
# SSH_PRIVATE_KEY) задаются в Settings → CI/CD → Variables (или на группе) —
# НЕ хардкодим их здесь: переменные job-уровня перекрыли бы групповые.

.base_deploy:
  image: obvu/ssh_deployer
  before_script:
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
  after_script:
    - rm -f ~/.ssh/id_rsa
  variables:
    GIT_STRATEGY: none
    # Compose-проект (-p) — по умолчанию $CI_PROJECT_NAME; можно переопределить
    # переменной DEPLOY_COMPOSE_PROJECT в CI/CD (если на сервере проект поднят
    # ansible с другим -p <project_name>).
  script:
    - |
      COMPOSE_PROJECT="${DEPLOY_COMPOSE_PROJECT:-$CI_PROJECT_NAME}"
      ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa "$DEPLOY_HOST" "
        cd '$DEPLOY_PATH/docker' &&
        FRONTEND_IMAGE='$FRONTEND_IMAGE_SHA' BACKEND_IMAGE='$BACKEND_IMAGE_SHA' \
          docker compose -p '$COMPOSE_PROJECT' -f docker-compose.prod.yml pull frontend backend &&
        FRONTEND_IMAGE='$FRONTEND_IMAGE_SHA' BACKEND_IMAGE='$BACKEND_IMAGE_SHA' \
          docker compose -p '$COMPOSE_PROJECT' -f docker-compose.prod.yml up -d &&
        docker compose -p '$COMPOSE_PROJECT' -f docker-compose.prod.yml ps
      "

deploy:production:
  extends: .base_deploy
  stage: deploy
  environment:
    name: production
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH