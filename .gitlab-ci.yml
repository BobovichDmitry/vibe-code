# =============================================================================
# GitLab CI — сборка образов (frontend Nuxt + backend Nest) в Registry и
# CI-деплой по SSH (pull образов из Registry + docker compose up) на целевой
# сервер.
#
# Архитектура: два отдельных сервиса (см. agents.md):
#   frontend — Nuxt SSR (Dockerfile.frontend, порт 3000, edge за nginx-proxy);
#   backend  (Nest API)  (Dockerfile.backend, порт 3001, внутренний без VIRTUAL_HOST).
# Деплой: docker-compose.prod.yml (frontend + backend + postgres).
#
# Этап deploy НЕ собирает ничего на сервере: джоба получает base64-бандл
# окружения (SSH-ключ + .env) из CI/CD Variables, передаёт его в
# docker/deploy_ci.sh, который:
#   — ставит на сервере всё с нуля (ansible → docker → nginx-proxy);
#   — пуллит собранные образы с ВРЕМЕННЫМ токеном (CI_JOB_TOKEN);
#   — поднимает docker-compose.prod.yml и прогоняет healthcheck.
#
# Требуемые CI/CD variables (Settings → CI/CD → Variables, protected+masked;
# по ОДНОЙ на окружение):
#   DEPLOY_BUNDLE_TEST        — base64-бандл для тест-сервера;
#   DEPLOY_BUNDLE_PRODUCTION  — base64-бандл для прод-сервера.
#
#   Бандл = base64( tar.gz[ id_rsa, .env ] ) — формируется скриптом
#   scripts/make_deploy_bundle.sh <id_rsa> <.env>:
#     id_rsa — приватный SSH-ключ БЕЗ passphrase;
#     .env   — SSH_HOST, SSH_USER, DOMAIN, LETSENCRYPT_EMAIL, ADMIN_PASSWORD,
#              PROJECT_NAME (обязательные); SSH_PORT, PROJECT_DIR, PROXY_DIR,
#              BRAND_*, ADMIN_LOGIN (опциональные). SSH_KEY не нужен — ключ
#              из бандла.
#
# Ветка master (default) → build → авто-деплой в test И production.
# Если бандл-переменная окружения не задана — деплой-джоба ПРОПУСКАЕТСЯ
# (warning в консоли, пайплайн зелёный, ошибок нет).
# =============================================================================

stages:
  - build
  - deploy

variables:
  DOCKER_TLS_CERTDIR: ""
  DOCKER_DRIVER: overlay2
  # Реестр-образы: два сервиса (split Dockerfile, монолита больше нет).
  FRONTEND_IMAGE_SHA: "$CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHORT_SHA"
  FRONTEND_IMAGE_REF: "$CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_REF_SLUG"
  FRONTEND_IMAGE_LATEST: "$CI_REGISTRY_IMAGE/frontend:latest"
  BACKEND_IMAGE_SHA: "$CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHORT_SHA"
  BACKEND_IMAGE_REF: "$CI_REGISTRY_IMAGE/backend:$CI_COMMIT_REF_SLUG"
  BACKEND_IMAGE_LATEST: "$CI_REGISTRY_IMAGE/backend:latest"

# =============================================
# Build — собирает и пушит ОБА образа в Registry
# =============================================

build:docker:
  stage: build
  image: docker:27-cli
  services:
    - name: docker:27-dind
      alias: docker
      command: ["--tls=false"]
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    # Контекст — корень репо: Dockerfile'ы сами копируют нужные workspace-папки
    # (monorepo: package.json + apps/* нужны обоим сборкам).
    - docker build --pull -f docker/Dockerfile.frontend -t "$FRONTEND_IMAGE_SHA" -t "$FRONTEND_IMAGE_REF" .
    - docker build --pull -f docker/Dockerfile.backend -t "$BACKEND_IMAGE_SHA" -t "$BACKEND_IMAGE_REF" .
    - docker push "$FRONTEND_IMAGE_SHA"
    - docker push "$FRONTEND_IMAGE_REF"
    - docker push "$BACKEND_IMAGE_SHA"
    - docker push "$BACKEND_IMAGE_REF"
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        docker tag "$FRONTEND_IMAGE_SHA" "$FRONTEND_IMAGE_LATEST"
        docker push "$FRONTEND_IMAGE_LATEST"
        docker tag "$BACKEND_IMAGE_SHA" "$BACKEND_IMAGE_LATEST"
        docker push "$BACKEND_IMAGE_LATEST"
      fi
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

# =============================================
# Deploy — CI-деплой из Registry (без сборки на сервере)
# =============================================
# Джоба декодирует бандл окружения (DEPLOY_BUNDLE_<ENV>) и запускает
# docker/deploy_ci.sh: он ставит ansible/docker/nginx-proxy на пустом сервере,
# пуллит образы с временным токеном (CI_JOB_TOKEN) и поднимает compose.
# ВНИМАНИЕ: бандл-переменные задаются в Settings → CI/CD → Variables
# (protected + masked) — НЕ хардкодим их здесь.

.base_deploy_ci:
  image: ubuntu:24.04
  variables:
    # Нужны ansible/ и docker/ из репо (архив исходников для сервера).
    GIT_STRATEGY: fetch

deploy:test:
  extends: .base_deploy_ci
  stage: deploy
  environment:
    name: test
  resource_group: deploy-test
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    # Бандл не задан → деплой ПРОПУСКАЕТСЯ (джоба зелёная), а не падает.
    - |
      if [ -z "${DEPLOY_BUNDLE_TEST:-}" ]; then
        echo "⚠  DEPLOY_BUNDLE_TEST не задан — деплой в окружение 'test' ПРОПУЩЕН."
        echo "   Чтобы включить: Settings → CI/CD → Variables → DEPLOY_BUNDLE_TEST (protected+masked)."
        echo "   Бандл: scripts/make_deploy_bundle.sh <id_rsa> <.env>"
        exit 0
      fi
      apt-get update -qq && apt-get install -y -qq openssh-client ca-certificates curl
      export DEPLOY_BUNDLE="$DEPLOY_BUNDLE_TEST"
      export FRONTEND_IMAGE="$FRONTEND_IMAGE_SHA"
      export BACKEND_IMAGE="$BACKEND_IMAGE_SHA"
      bash docker/deploy_ci.sh

deploy:production:
  extends: .base_deploy_ci
  stage: deploy
  environment:
    name: production
  resource_group: deploy-production
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - |
      if [ -z "${DEPLOY_BUNDLE_PRODUCTION:-}" ]; then
        echo "⚠ DEPLOY_BUNDLE_PRODUCTION не задан — деплой в окружение 'production' ПРОПУЩЕН."
        echo "   Заведи переменную в Settings → CI/CD → Variables (protected+masked):"
        echo "   scripts/make_deploy_bundle.sh <id_rsa> <.env>  →  в DEPLOY_BUNDLE_PRODUCTION"
        exit 0
      fi
      apt-get update -qq && apt-get install -y -qq openssh-client ca-certificates curl
      export DEPLOY_BUNDLE="$DEPLOY_BUNDLE_PRODUCTION"
      export FRONTEND_IMAGE="$FRONTEND_IMAGE_SHA"
      export BACKEND_IMAGE="$BACKEND_IMAGE_SHA"
      bash docker/deploy_ci.sh