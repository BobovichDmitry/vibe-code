# =============================================================================
# Роль docker: установка Docker Engine + compose-plugin (Debian/Ubuntu)
# Идемпотентно — повторный запуск не переустанавливает.
# =============================================================================

- name: Установить базовые пакеты (git, curl, ca-certificates, gnupg)
  ansible.builtin.apt:
    name:
      - git
      - curl
      - ca-certificates
      - gnupg
      - python3
      - python3-pip
    state: present
    update_cache: true

- name: Создать keyring-директорию для Docker
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Скачать GPG-ключ Docker
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"
    force: true

- name: Добавить apt-репозиторий Docker
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ ansible_architecture | replace('x86_64', 'amd64') | replace('aarch64', 'arm64') }}
      signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/{{ ansible_distribution | lower }}
      {{ ansible_distribution_release }} stable
    state: present
    update_cache: true

- name: Установить Docker Engine + compose-plugin
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
    state: present

- name: Проверить docker --version
  ansible.builtin.command: docker --version
  register: docker_version_check
  changed_when: false

- name: Проверить docker compose version
  ansible.builtin.command: docker compose version
  register: docker_compose_check
  changed_when: false

- name: Вывести версии Docker
  ansible.builtin.debug:
    msg:
      - "{{ docker_version_check.stdout }}"
      - "{{ docker_compose_check.stdout }}"