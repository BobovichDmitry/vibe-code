# =============================================================================
# Роль app: распаковка архива, генерация env, build/up приложения (frontend + backend)
# =============================================================================

- name: Создать project_dir
  ansible.builtin.file:
    path: "{{ project_dir }}"
    state: directory
    mode: "0755"

- name: Распаковать архив исходников
  ansible.builtin.unarchive:
    src: "{{ archive_path }}"
    dest: "{{ project_dir }}"
    remote_src: true
    creates: "{{ project_dir }}/package.json"

- name: Рендерить docker/env из шаблона (backend + compose-интерполяция)
  ansible.builtin.template:
    src: env.j2
    dest: "{{ project_dir }}/docker/env"
    mode: "0600"

# docker-compose.prod.yml интерполирует ${VIRTUAL_HOST}/${DB_USERNAME}/... —
# compose читает их из .env рядом с compose-файлом (env_file для интерполяции НЕ используется).
- name: Рендерить docker/.env для compose-интерполяции
  ansible.builtin.copy:
    src: "{{ project_dir }}/docker/env"
    dest: "{{ project_dir }}/docker/.env"
    remote_src: true
    mode: "0600"

# --- CI-режим (Registry): frontend_image/backend_image переданы через -e —
# образы уже собраны в GitLab CI, сервер их только пуллит (без build).
- name: Прокинуть Registry-образы в docker/.env (CI-режим)
  ansible.builtin.lineinfile:
    path: "{{ project_dir }}/docker/.env"
    line: "{{ item.key }}={{ item.value }}"
  loop:
    - { key: FRONTEND_IMAGE, value: "{{ frontend_image }}" }
    - { key: BACKEND_IMAGE, value: "{{ backend_image }}" }
  when: frontend_image is defined and backend_image is defined

- name: Pull frontend+backend из Registry (CI-режим, без сборки на сервере)
  ansible.builtin.command: docker compose -p {{ project_name }} -f {{ prod_compose_file }} pull frontend backend
  args:
    chdir: "{{ project_dir }}/docker"
  register: app_pull
  changed_when: false
  when: frontend_image is defined and backend_image is defined

# --- Ручной режим (deploy.sh): build из исходников на сервере ---
- name: Собрать frontend+backend (docker compose build)
  ansible.builtin.command: docker compose -p {{ project_name }} -f {{ prod_compose_file }} build
  args:
    chdir: "{{ project_dir }}/docker"
  register: app_build
  changed_when: "'SUCCESSFULLY' in app_build.stderr or 'naming to' in app_build.stderr"
  when: frontend_image is not defined or backend_image is not defined

- name: Поднять frontend+backend+postgres (docker compose up -d)
  ansible.builtin.command: docker compose -p {{ project_name }} -f {{ prod_compose_file }} up -d
  args:
    chdir: "{{ project_dir }}/docker"
  register: app_up
  changed_when: "'Started' in app_up.stderr or 'Creating' in app_up.stderr"

# --- Синхронизация db_password (28P01): PostgreSQL-роль создаётся при первом
# запуске контейнера с паролем из POSTGRES_PASSWORD. Смена db_password в
# vars.yml/.app.secrets НЕ меняет роль в persistent volume — backend получает
# 28P01 и не поднимается. Поэтому: дожидаемся готовности PG, idempotent-но
# подтягиваем пароль роли и перезапускаем backend.
- name: Дождаться готовности PostgreSQL (pg_isready)
  ansible.builtin.command:
    docker compose -p {{ project_name }} -f {{ prod_compose_file }} exec -T postgres
      pg_isready -U {{ db_username }} -d {{ db_name }}
  args:
    chdir: "{{ project_dir }}/docker"
  register: pg_ready
  until: pg_ready.rc == 0
  retries: 30
  delay: 2
  changed_when: false

- name: Синхронизировать пароль роли PostgreSQL с db_password (idempotent)
  ansible.builtin.shell: |
    docker compose -p {{ project_name }} -f {{ prod_compose_file }} exec -T postgres \
      psql -U {{ db_username }} -d {{ db_name }} <<'SQL'
    ALTER USER "{{ db_username }}" WITH PASSWORD '{{ db_password | regex_replace("'", "''") }}';
    SQL
  args:
    chdir: "{{ project_dir }}/docker"
  register: db_password_sync
  changed_when: false
  no_log: true

- name: Перезапустить backend после синхронизации пароля БД
  ansible.builtin.command: docker compose -p {{ project_name }} -f {{ prod_compose_file }} restart backend
  args:
    chdir: "{{ project_dir }}/docker"
  when: db_password_sync is changed
  changed_when: true

- name: Вывести результат deploy
  ansible.builtin.debug:
    msg:
      - "Registry-pull: {{ (app_pull.stderr_lines | default(['—']))[-3:] }}"
      - "Build: {{ (app_build.stderr_lines | default(['—']))[-3:] }}"
      - "Up: {{ (app_up.stderr_lines | default(['—']))[-3:] }}"