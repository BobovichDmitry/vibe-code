# =============================================================================
# Роль app: распаковка архива, генерация env, деплой 0downtime (blue-green).
#
# Логика blue-green переключения целиком в docker/deploy_0downtime.sh
# (build/pull standby-слота → healthcheck → переключение upstream edge-nginx
# → верификация → останов старого слота + rollback при ошибке).
# Роль только готовит окружение: env, образы в docker/.env, postgres,
# синхронизация пароля БД — и запускает скрипт деплоя.
# =============================================================================

- name: Создать project_dir
  ansible.builtin.file:
    path: "{{ project_dir }}"
    state: directory
    mode: "0755"

- name: Распаковать архив исходников
  ansible.builtin.unarchive:
    src: "{{ archive_path }}"
    dest: "{{ project_dir }}"
    remote_src: true
    creates: "{{ project_dir }}/package.json"

- name: Рендерить docker/env из шаблона (backend + compose-интерполяция)
  ansible.builtin.template:
    src: env.j2
    dest: "{{ project_dir }}/docker/env"
    mode: "0600"

# docker-compose.prod.yml интерполирует ${VIRTUAL_HOST}/${DB_USERNAME}/... —
# compose читает их из .env рядом с compose-файлом (env_file для интерполяции НЕ используется).
- name: Рендерить docker/.env для compose-интерполяции
  ansible.builtin.copy:
    src: "{{ project_dir }}/docker/env"
    dest: "{{ project_dir }}/docker/.env"
    remote_src: true
    mode: "0600"

# --- CI-режим (Registry): frontend_image/backend_image переданы через -e —
# образы уже собраны в GitLab CI, скрипт деплоя делает pull (--pull).
- name: Прокинуть Registry-образы в docker/.env (CI-режим)
  ansible.builtin.lineinfile:
    path: "{{ project_dir }}/docker/.env"
    line: "{{ item.key }}={{ item.value }}"
  loop:
    - { key: FRONTEND_IMAGE, value: "{{ frontend_image }}" }
    - { key: BACKEND_IMAGE, value: "{{ backend_image }}" }
  when: frontend_image is defined and backend_image is defined

# --- Postgres поднимаем ДО запуска слотов: backend нового слота стартует
# с корректным паролем роли, restart после синхронизации не нужен.
- name: Поднять postgres (общий для обоих слотов)
  ansible.builtin.command: docker compose -p {{ project_name }} -f {{ prod_compose_file }} up -d postgres
  args:
    chdir: "{{ project_dir }}/docker"
  changed_when: false

- name: Дождаться готовности PostgreSQL (pg_isready)
  ansible.builtin.command:
    docker compose -p {{ project_name }} -f {{ prod_compose_file }} exec -T postgres
      pg_isready -U {{ db_username }} -d {{ db_name }}
  args:
    chdir: "{{ project_dir }}/docker"
  register: pg_ready
  until: pg_ready.rc == 0
  retries: 30
  delay: 2
  changed_when: false

# --- Синхронизация db_password (28P01): PostgreSQL-роль создаётся при первом
# запуске контейнера с паролем из POSTGRES_PASSWORD. Смена db_password в
# vars.yml/.app.secrets НЕ меняет роль в persistent volume. Idempotent-но
# подтягиваем пароль роли ДО старта нового слота.
- name: Синхронизировать пароль роли PostgreSQL с db_password (idempotent)
  # psql :'pw' — переменная с SQL-экранированием; интерполяция работает ТОЛЬКО
  # в stdin-скриптах (не в -c), поэтому SQL подаётся через echo | psql.
  # Без heredoc/regex_replace — они ломают парсер задач ansible 2.16.
  ansible.builtin.shell: >-
    echo "ALTER USER \"{{ db_username }}\" WITH PASSWORD :'pw';" |
    docker compose -p {{ project_name }} -f {{ prod_compose_file }} exec -T postgres
    psql -U {{ db_username }} -d {{ db_name }} -v pw={{ db_password | quote }}
  args:
    chdir: "{{ project_dir }}/docker"
  register: db_password_sync
  changed_when: false
  no_log: true

# --- Деплой 0downtime: blue-green переключение целиком в скрипте.
- name: 'Деплой без простоя (CI: pull из Registry)'
  ansible.builtin.command: ./deploy_0downtime.sh {{ project_name }} --pull
  args:
    chdir: "{{ project_dir }}/docker"
  when: frontend_image is defined and backend_image is defined
  changed_when: true

- name: 'Деплой без простоя (ручной: сборка на сервере)'
  ansible.builtin.command: ./deploy_0downtime.sh {{ project_name }} --build
  args:
    chdir: "{{ project_dir }}/docker"
  when: frontend_image is not defined or backend_image is not defined
  changed_when: true

- name: Вывести результат deploy
  ansible.builtin.debug:
    msg:
      - "Активный слот и лог переключения — в docker/deploy_0downtime.sh (docker/.active-slot)."
      - "Логи слотов: cd {{ project_dir }}/docker && docker compose -p {{ project_name }} -f {{ prod_compose_file }} logs edge-nginx"
