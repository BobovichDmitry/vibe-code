# =============================================================================
# Переменные для ansible-деплоя (плейсхолдеры — реальные значения в vars.yml).
#
# Портируемость по форкам: НЕТ хардкода слага проекта/имени БД.
# project_name, db_username, db_name выводятся из project_name (задаётся в .env /
# vars.yml). project_dir = /opt/<project_name>.
# =============================================================================

# --- Сервер ---
# IP-адрес сервера (для документации/проверок; ansible работает локально)
server_ip: "127.0.0.1"
# Домен приложения (должен указывать DNS-записью на server_ip)
domain: "app.example.com"
# Слаг проекта: исходники в /opt/<project_name>, контейнеры/тома/сети с префиксом <project_name>
# ЗАПОЛНИТЬ в vars.yml (плейсхолдер — не дефолт для форка).
project_name: "my-project"

# --- Пути (выводятся из project_name, можно переопределить в vars.yml) ---
# Куда распаковывается архив исходников
project_dir: "/opt/{{ project_name }}"
# Путь к загруженному через sftp архиву tar.gz на сервере
archive_path: "/opt/{{ project_name }}.tar.gz"
# Где живёт общий compose для nginx-proxy (один раз на сервере)
proxy_dir: "/opt/nginx-proxy"

# --- PostgreSQL (выводятся из project_name) ---
db_username: "{{ project_name }}"
db_password: "CHANGE_ME_strong_password"
db_name: "{{ project_name }}_db"

# --- JWT ---
# Сгенерировать: node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"
jwt_secret: "CHANGE_ME_jwt_secret"

# --- Первый админ (создаётся только на пустой БД) ---
admin_login: "admin"
admin_password: "CHANGE_ME_admin_password"

# --- Брендинг ---
brand_title: "VibeSetup UI"
brand_favicon_url: "/favicon.svg"

# --- Let's Encrypt ---
letsencrypt_email: "admin@example.com"

# --- Production compose / CORS ---
# Compose-файл прод-деплоя (относительно docker/)
prod_compose_file: "docker-compose.prod.yml"
# Compose-файл общего nginx-proxy (в proxy_dir)
proxy_compose_file: "compose-proxy.yml"
# Origin клиента за nginx-proxy (HTTPS-домен) — для backend CORS_ORIGIN
cors_origin: "https://{{ domain }}"
# --- Дополнительно прокидываемые переменные окружения (generic pass-through) ---
# Наполняется деплой-скриптами (deploy.sh / deploy_ci.sh): любая переменная
# из .env / .envs/<env>/*.yaml (кроме базовых ключей деплоя) попадает в
# docker/env как "KEY=value". Форк управляет окружением из git.
extra_env: {}
